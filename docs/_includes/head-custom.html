<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var blocks = document.querySelectorAll('pre > code.language-mermaid, code.language-mermaid');
  blocks.forEach(function (code) {
    var pre = code.closest('pre') || code;
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    pre.parentNode.replaceChild(div, pre);
  });
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: true, theme: 'neutral', securityLevel: 'loose' });
  }
});
</script>
<style>
  .mermaid { background:#fff; padding:1rem; border:1px solid #e1e4e8; border-radius:6px; overflow-x:auto; margin:1.5rem 0; }
  .main-content table { display:table; width:100%; }
  .main-content table th, .main-content table td { font-size:0.95rem; }
</style>
